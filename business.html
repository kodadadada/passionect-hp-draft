<html lang="ja">

<div id="site-header"></div>

      <p>提供中の事業と、これから取り組む事業を分けてご紹介します。</p>

        <li class="card">

          <span class="status">今後の構想</span>

        </li>
      </ul>

  </section>

  <section class="band cta">
    <div class="wrap cta-box">
      <div>
        <h2>協業のご相談も歓迎です</h2>
      </div>
      <a class="btn" href="contact.html">お問い合わせへ</a>
