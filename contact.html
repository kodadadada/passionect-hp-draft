<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お問い合わせ | パスコネ（Passionect）</title>
<meta name="description" content="パスコネへのお仕事のご依頼・ご相談はこちらから受け付けています。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div id="site-header"></div>

<main>
  <div class="page-head">
    <div class="wrap">
      <h1>お問い合わせ</h1>
      <p>お仕事のご依頼やご相談を受け付けています。</p>
    </div>
  </div>

  <section class="band">
    <div class="wrap two">
      <div>
        <div class="head">
          <h2>ご相談いただける内容</h2>
        </div>
        <ul class="bullets">
          <li>配信支援サービスのご依頼・ご相談</li>
          <li>お取引・協業のご相談</li>
          <li>その他、パスコネへのお問い合わせ</li>
        </ul>
        <div class="prose" style="margin-top:20px">
          <p>商品のご購入や、購入後のお問い合わせは、BOOTHの各商品ページをご確認ください。</p>
        </div>
      </div>
      <div>
        <div class="head">
          <h2>お問い合わせ方法</h2>
        </div>
        <p>下のフォームからご連絡ください。内容を確認し、ご連絡先に返信します。</p>
        <p style="margin-top:16px"><button class="btn" id="form-open" type="button">お問い合わせフォームを開く</button></p>
        <p id="form-note" hidden>フォームは準備中です。公開時にここからフォームが開きます。</p>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<script src="assets/site.js"></script>
</body>
</html>
